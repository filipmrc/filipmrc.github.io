<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} &mdash; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {%- if page.description %}<meta name="description" content="{{ page.description }}">{% endif -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/landing.css' | relative_url }}">
  {%- feed_meta -%}
</head>
<body>
<div class="landing-wrapper">
  <div class="landing-container">

    <header class="landing-nav">
      {%- if page.layout == 'landing' -%}
      <div class="header-hero">
        <h1>{{ site.title }}</h1>
        <p class="tagline">
          AI Research Scientist, Meta<br>
          San Francisco Bay Area
        </p>
      </div>
      {%- else -%}
      <a class="sitename" href="{{ '/' | relative_url }}">Home</a>
      {%- endif -%}
      <nav>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/assets/fm_cv_2026.pdf' | relative_url }}">CV</a>
        <a href="https://scholar.google.com/citations?user=o_cwgrkAAAAJ">Scholar</a>
        <a href="https://github.com/filipmrc">GitHub</a>
        <a href="https://www.linkedin.com/in/filipmrc">LinkedIn</a>
      </nav>
    </header>

{{ content }}

    <footer class="landing-footer">
      <a class="email" href="&#109;&#97;&#105;&#108;&#116;&#111;&#58;&#102;&#105;&#108;&#105;&#112;&#109;&#114;&#99;&#64;&#112;&#109;&#46;&#109;&#101;">&#102;&#105;&#108;&#105;&#112;&#109;&#114;&#99;&#64;&#112;&#109;&#46;&#109;&#101;</a>
      <span class="links">
        <a href="https://scholar.google.com/citations?user=o_cwgrkAAAAJ">scholar</a>
        <a href="https://github.com/filipmrc">github</a>
        <a href="https://www.linkedin.com/in/filipmrc">linkedin</a>
        <a href="https://x.com/filipmrc">x</a>
      </span>
    </footer>

  </div>
</div>
</body>
</html>
